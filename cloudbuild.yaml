steps:
  # 1. Build backend container.
  # "." at the end means repo root is the Docker build context.
  - name: "gcr.io/cloud-builders/docker"
    args:
      - "build"
      - "-f"
      - "backend/Dockerfile"
      - "-t"
      - "us-west3-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/anvil-backend:$COMMIT_SHA"
      - "."

  # 2. Push container image.
  - name: "gcr.io/cloud-builders/docker"
    args:
      - "push"
      - "us-west3-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/anvil-backend:$COMMIT_SHA"

  # 3. Deploy to Cloud Run.
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    entrypoint: "gcloud"
    args:
      - "run"
      - "deploy"
      - "anvil-backend"
      - "--image"
      - "us-west3-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/anvil-backend:$COMMIT_SHA"
      - "--region"
      - "us-west3"
      - "--platform"
      - "managed"
      - "--memory"
      - "2Gi"
      - "--cpu"
      - "1"

images:
  - "us-west3-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/anvil-backend:$COMMIT_SHA"
options:
  logging: CLOUD_LOGGING_ONLY
