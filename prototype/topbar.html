<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Top Bar</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            anvil: {
              bg: '#0b0d12',
              panel: '#11141c',
              panelHover: '#181b27',
              border: '#1f2433',
              text: '#e6e9f0',
              muted: '#8b92a8',
              accent: '#3b82f6',
              success: '#22c55e'
            }
          }
        }
      }
    }
  </script>
  <style>
    body { margin: 0; background: #11141c; color: #e6e9f0; font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, sans-serif; }
  </style>
</head>
<body class="h-full w-full flex items-center justify-between px-4">
  <div class="flex items-center gap-6">
    <!-- Logo -->
    <div class="flex items-center gap-2">
      <div class="w-7 h-7 rounded bg-gradient-to-br from-blue-500 to-indigo-600 flex items-center justify-center text-white font-bold text-sm">A</div>
      <span class="font-semibold tracking-tight text-white">ANVIL</span>
    </div>

    <!-- Project Selector -->
    <div class="relative">
      <button id="projectBtn" class="flex items-center gap-2 px-3 py-1.5 rounded-md bg-[#181b27] border border-[#1f2433] hover:border-[#3b82f6] transition text-sm">
        <span class="text-anvil-muted">Project:</span>
        <span class="font-medium text-white">Robot Actuator V1</span>
        <svg class="w-4 h-4 text-anvil-muted" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7"/></svg>
      </button>
      <div id="projectMenu" class="hidden absolute top-full left-0 mt-2 w-64 rounded-lg bg-[#181b27] border border-[#1f2433] shadow-xl z-50 overflow-hidden">
        <div class="px-3 py-2 text-xs font-semibold text-anvil-muted uppercase tracking-wider">Recent Projects</div>
        <button class="w-full text-left px-3 py-2 text-sm hover:bg-[#1f2433] flex items-center gap-2 text-white bg-[#1f2433]">
          <span class="w-1.5 h-1.5 rounded-full bg-anvil-success"></span>
          Robot Actuator V1
        </button>
        <button class="w-full text-left px-3 py-2 text-sm hover:bg-[#1f2433] flex items-center gap-2 text-anvil-text">
          <span class="w-1.5 h-1.5 rounded-full bg-anvil-warning"></span>
          RC Plane Telemetry
        </button>
        <button class="w-full text-left px-3 py-2 text-sm hover:bg-[#1f2433] flex items-center gap-2 text-anvil-text">
          <span class="w-1.5 h-1.5 rounded-full bg-anvil-muted"></span>
          Custom Drone Frame
        </button>
        <button class="w-full text-left px-3 py-2 text-sm hover:bg-[#1f2433] text-anvil-text">
          + New Project
        </button>
      </div>
    </div>

    <!-- Status Badge -->
    <div class="flex items-center gap-2 px-2.5 py-1 rounded-full bg-green-500/10 border border-green-500/20 text-green-400 text-xs font-medium">
      <span class="w-1.5 h-1.5 rounded-full bg-green-400 animate-pulse"></span>
      ACTIVE
    </div>
  </div>

  <div class="flex items-center gap-5 text-sm text-anvil-muted">
    <div class="flex items-center gap-2">
      <span class="w-2 h-2 rounded-full bg-green-400"></span>
      Cloud: Google Cloud
    </div>
    <div class="flex items-center gap-2">
      <span class="w-2 h-2 rounded-full bg-green-400"></span>
      Local Workshop
    </div>
  </div>

  <script>
    const btn = document.getElementById('projectBtn');
    const menu = document.getElementById('projectMenu');
    btn.addEventListener('click', (e) => { e.stopPropagation(); menu.classList.toggle('hidden'); });
    document.addEventListener('click', () => menu.classList.add('hidden'));
  </script>
</body>
</html>
