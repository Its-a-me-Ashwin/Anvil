<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Anvil — AI Engineering Workspace</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            anvil: {
              bg: '#0b0d12',
              panel: '#11141c',
              panelHover: '#181b27',
              border: '#1f2433',
              text: '#e6e9f0',
              muted: '#8b92a8',
              accent: '#3b82f6',
              success: '#22c55e',
              warning: '#f59e0b',
              danger: '#ef4444'
            }
          }
        }
      }
    }
  </script>
  <style>
    body { margin: 0; overflow: hidden; background: #0b0d12; color: #e6e9f0; }
    iframe { border: none; display: block; }
    .panel-frame { background: #11141c; border: 1px solid #1f2433; }
  </style>
</head>
<body class="h-screen w-screen flex flex-col">
  <!-- Top Bar -->
  <div class="h-14 shrink-0 panel-frame">
    <iframe src="topbar.html" class="w-full h-full" name="topbar"></iframe>
  </div>

  <!-- Main Work Area -->
  <div class="flex-1 flex overflow-hidden">
    <!-- Left Project Panel -->
    <div class="w-[22%] min-w-[260px] panel-frame border-t-0">
      <iframe src="left-project.html" class="w-full h-full" name="left-project"></iframe>
    </div>

    <!-- Center Workspace -->
    <div class="flex-1 panel-frame border-t-0 border-l-0 border-r-0">
      <iframe src="center.html" class="w-full h-full" name="center"></iframe>
    </div>

    <!-- Right Agent Panel -->
    <div class="w-[24%] min-w-[300px] panel-frame border-t-0">
      <iframe src="right-agent.html" class="w-full h-full" name="right-agent"></iframe>
    </div>
  </div>

  <!-- Bottom Data Sources Strip -->
  <div class="h-44 shrink-0 panel-frame border-t-0">
    <iframe src="bottom.html" class="w-full h-full" name="bottom"></iframe>
  </div>
</body>
</html>
